name: CI / CD – TurboVets App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker image, push to ECR, deploy with CDKTF
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      CONTAINER_PORT: "3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          : "${AWS_REGION:?AWS_REGION repo variable not set}"
          : "${ENVIRONMENT:?ENVIRONMENT repo variable not set}"
          : "${SERVICE_NAME:?SERVICE_NAME repo variable not set}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image metadata
        id: image-meta
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=${{ steps.login-ecr.outputs.registry }}/${SERVICE_NAME}-${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Ensure ECR repository exists
        run: |
          REPO="${SERVICE_NAME}-${ENVIRONMENT}"

          if ! aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1; then
            echo "Creating ECR repository: $REPO"
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE \
              >/dev/null
          else
            echo "ECR repository already exists: $REPO"
          fi

      - name: Build Docker image
        run: |
          docker build \
            -f app/Dockerfile \
            -t "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            app/

      - name: Push Docker image to ECR
        run: docker push "${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Set up Node.js for CDKTF
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Install IaC dependencies
        working-directory: iac
        run: npm ci

      - name: Generate CDKTF provider bindings
        working-directory: iac
        run: npx cdktf get

      - name: Build CDKTF app
        working-directory: iac
        run: npm run build

      - name: Deploy with CDK for Terraform
        working-directory: iac
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          CONTAINER_IMAGE: "${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
        run: |
          npx cdktf deploy --auto-approve
